<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Exam Seating System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            university: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#059669', 700: '#047857',
              800: '#065f46', 900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
<base target="_blank">
<base target="_blank">
</head>
<body class="bg-gray-50 min-h-screen font-['Cairo']">
  <div class="flex h-screen">
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shadow-lg z-20">
      <div class="p-6 border-b border-gray-100">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-lg bg-university-100 flex items-center justify-center">
            <img src="../image/logo.png" alt="University Logo" class="w-16 h-16 object-contain">
          </div>
          <div>
            <span class="text-lg font-bold text-gray-900 block leading-tight">Exam Seating</span>
            <span class="text-xs text-university-600 font-semibold">Admin Portal</span>
          </div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <button onclick="navigate('dashboard')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-chart-pie w-5 text-center text-university-500"></i><span>Dashboard</span>
        </button>
        <button onclick="navigate('students')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-user-graduate w-5 text-center text-blue-500"></i><span>Students</span>
        </button>
        <button onclick="navigate('semesters')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-calendar-alt w-5 text-center text-purple-500"></i><span>Semesters</span>
        </button>
        <button onclick="navigate('subjects')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-book w-5 text-center text-orange-500"></i><span>Subjects</span>
        </button>
        <button onclick="navigate('enrollments')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-file-signature w-5 text-center text-pink-500"></i><span>Enrollments</span>
        </button>
        <button onclick="navigate('exam-types')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-tags w-5 text-center text-yellow-500"></i><span>Exam Types</span>
        </button>
        <button onclick="navigate('exams')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-clipboard-list w-5 text-center text-red-500"></i><span>Exams</span>
        </button>
        <button onclick="navigate('buildings')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-building w-5 text-center text-gray-500"></i><span>Buildings</span>
        </button>
        <button onclick="navigate('halls')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-door-open w-5 text-center text-indigo-500"></i><span>Halls</span>
        </button>
        <button onclick="navigate('supervisors')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-user-tie w-5 text-center text-emerald-500"></i><span>Supervisors</span>
        </button>
        <button onclick="navigate('seat-assignments')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-chair w-5 text-center text-cyan-500"></i><span>Seat Assignments</span>
        </button>
        <button onclick="navigate('proposals')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-clipboard-question w-5 text-center text-rose-500"></i><span>Cancellation Proposals</span>
        </button>
        <button onclick="navigate('password-resets')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-key w-5 text-center text-amber-500"></i><span>Password Reset Requests</span>
        </button>
        <button onclick="navigate('admins')" class="sidebar-link w-full text-left px-4 py-3 rounded-lg text-sm font-medium text-gray-700 flex items-center space-x-3">
          <i class="fas fa-user-shield w-5 text-center text-red-500"></i><span>Admins</span>
        </button>
      </nav>
      <div class="p-4 border-t border-gray-100 bg-gray-50">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-university-100 flex items-center justify-center">
              <i class="fas fa-user-shield text-university-600 text-xs"></i>
            </div>
            <span id="userName" class="text-sm text-gray-600 font-medium truncate max-w-[120px]"></span>
          </div>
          <button onclick="logout('admin')" class="text-sm text-red-600 hover:text-red-800 font-medium flex items-center space-x-1 transition-colors">
            <i class="fas fa-sign-out-alt"></i><span>Logout</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto bg-gray-50">
      <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between sticky top-0 z-10">
        <div>
          <h1 id="page-title" class="text-2xl font-bold text-gray-900 flex items-center space-x-3">
            <i class="fas fa-chart-pie text-university-500 mr-3"></i><span>Dashboard</span>
          </h1>
          <p id="page-desc" class="text-gray-500 mt-1 text-sm">Overview of the examination system</p>
        </div>
        <div class="flex items-center space-x-4">
          <div class="text-right hidden md:block">
            <p class="text-xs text-gray-500">University of Aleppo</p>
            <p class="text-xs font-semibold text-university-600">Informatics Engineering Faculty</p>
          </div>
          <div class="w-10 h-10 rounded-lg bg-university-100 flex items-center justify-center opacity-80">
            <i class="fas fa-university text-university-600 text-lg"></i>
          </div>
        </div>
      </div>
      <div class="p-8">
        <div id="page-header" class="mb-8 hidden"></div>
        <div id="content-area"></div>
      </div>
    </main>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto relative z-10 border border-gray-100">
        <div class="p-6 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-university-50 to-blue-50">
          <h3 id="modal-title" class="text-lg font-bold text-gray-900 flex items-center space-x-2">
            <i class="fas fa-plus-circle text-university-500 mr-2"></i><span>Create</span>
          </h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div id="modal-body" class="p-6"></div>
        <div id="modal-footer" class="p-6 border-t border-gray-100 bg-gray-50 rounded-b-2xl flex justify-end space-x-3">
          <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors flex items-center space-x-1">
            <i class="fas fa-times text-xs"></i><span>Cancel</span>
          </button>
          <button id="modal-save" class="px-4 py-2 text-sm font-medium text-white bg-gradient-to-r from-university-600 to-university-500 rounded-lg hover:from-university-700 hover:to-university-600 transition-all flex items-center space-x-1 shadow-md">
            <i class="fas fa-check text-xs"></i><span>Save</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const api = checkAuth('admin');
    if (!api) window.location.href = '/admin/login.html';
    const user = JSON.parse(localStorage.getItem('admin_user') || '{}');
    document.getElementById('userName').textContent = user.full_name || 'Admin';

    let currentView = 'dashboard';
    let currentData = [];

    const pageIcons = {
      dashboard: 'fa-chart-pie', students: 'fa-user-graduate', semesters: 'fa-calendar-alt',
      subjects: 'fa-book', enrollments: 'fa-file-signature', 'exam-types': 'fa-tags',
      exams: 'fa-clipboard-list', buildings: 'fa-building', halls: 'fa-door-open',
      supervisors: 'fa-user-tie', 'seat-assignments': 'fa-chair', proposals: 'fa-clipboard-question',
      admins: 'fa-user-shield'
    };

    function navigate(view) {
      currentView = view;
      document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      const iconClass = pageIcons[view] || 'fa-circle';
      document.getElementById('page-title').innerHTML = `<i class="fas ${iconClass} text-university-500 mr-3"></i><span>${view.charAt(0).toUpperCase() + view.slice(1).replace('-', ' ')}</span>`;
      renderView();
    }

    function renderView() {
      const area = document.getElementById('content-area');
      const desc = document.getElementById('page-desc');
      area.innerHTML = `<div class="text-center py-12"><div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-university-200 border-t-university-600"></div><p class="mt-3 text-gray-500 text-sm">Loading data...</p></div>`;
      switch(currentView) {
        case 'dashboard': renderDashboard(); break;
        case 'students': desc.textContent='Manage student accounts'; renderCrud('students', 'student'); break;
        case 'semesters': desc.textContent='Academic terms'; renderCrud('semesters', 'semester'); break;
        case 'subjects': desc.textContent='Courses and curriculum'; renderCrud('subjects', 'subject'); break;
        case 'enrollments': desc.textContent='Student subject registrations'; renderCrud('enrollments', 'enrollment'); break;
        case 'exam-types': desc.textContent='Categories of examinations'; renderCrud('exam-types', 'examType'); break;
        case 'exams': desc.textContent='Schedule and manage exams'; renderExams(); break;
        case 'buildings': desc.textContent='Campus buildings'; renderCrud('buildings', 'building'); break;
        case 'halls': desc.textContent='Examination venues'; renderCrud('halls', 'hall'); break;
        case 'supervisors': desc.textContent='Examination staff'; renderCrud('supervisors', 'supervisor'); break;
        case 'seat-assignments': desc.textContent='Manual seat allocation'; renderSeatAssignments(); break;
        case 'proposals': desc.textContent='Supervisor cancellation requests'; renderProposals(); break;
        case 'password-resets': desc.textContent='Student and supervisor password requests'; renderPasswordResetRequests(); break;
        case 'admins': desc.textContent='Manage admin accounts'; renderCrud('admins', 'admin'); break;
      }
    }

    async function renderDashboard() {
      document.getElementById('page-desc').textContent = 'System overview';
      try {
        const [students, exams, halls, supervisors] = await Promise.all([
          api.get('/students?limit=1'), api.get('/exams?limit=1'),
          api.get('/halls?limit=1'), api.get('/supervisors?limit=1')
        ]);
        const stats = [
          { icon: 'fa-user-graduate', label: 'Total Students', value: students.data.total || 0, bg: 'bg-blue-50', text: 'text-blue-600', bar: 'from-blue-500 to-blue-600' },
          { icon: 'fa-clipboard-list', label: 'Scheduled Exams', value: exams.data.total || 0, bg: 'bg-red-50', text: 'text-red-600', bar: 'from-red-500 to-red-600' },
          { icon: 'fa-door-open', label: 'Halls', value: halls.data.total || 0, bg: 'bg-indigo-50', text: 'text-indigo-600', bar: 'from-indigo-500 to-indigo-600' },
          { icon: 'fa-user-tie', label: 'Supervisors', value: supervisors.data.total || 0, bg: 'bg-emerald-50', text: 'text-emerald-600', bar: 'from-emerald-500 to-emerald-600' },
        ];
        document.getElementById('content-area').innerHTML = `
          <div class="grid md:grid-cols-4 gap-6 mb-8">
            ${stats.map(s => `<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
              <div class="flex items-center justify-between">
                <div><p class="text-sm text-gray-500 font-medium">${s.label}</p><p class="text-3xl font-bold text-gray-900 mt-2">${s.value}</p></div>
                <div class="w-12 h-12 ${s.bg} rounded-xl flex items-center justify-center"><i class="fas ${s.icon} text-xl ${s.text}"></i></div>
              </div>
              <div class="mt-4 h-1 w-full bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r ${s.bar} rounded-full" style="width: ${Math.min((s.value / (s.value + 10)) * 100, 100)}%"></div></div>
            </div>`).join('')}
          </div>
          <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <div class="flex items-center space-x-3 mb-4"><div class="w-10 h-10 bg-university-100 rounded-lg flex items-center justify-center"><i class="fas fa-info-circle text-university-600"></i></div><h3 class="font-bold text-gray-900">System Information</h3></div>
              <div class="space-y-3 text-sm text-gray-600">
                <div class="flex items-center space-x-3"><i class="fas fa-university text-gray-400 w-5"></i><span>University of Aleppo</span></div>
                <div class="flex items-center space-x-3"><i class="fas fa-graduation-cap text-gray-400 w-5"></i><span>Informatics Engineering Faculty</span></div>
              </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
              <div class="flex items-center space-x-3 mb-4"><div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center"><i class="fas fa-bolt text-blue-600"></i></div><h3 class="font-bold text-gray-900">Quick Actions</h3></div>
              <div class="grid grid-cols-2 gap-3">
                <button onclick="navigate('exams')" class="p-3 rounded-lg bg-gray-50 hover:bg-university-50 text-sm font-medium text-gray-700 hover:text-university-700 text-left flex items-center space-x-2"><i class="fas fa-plus text-university-500"></i><span>Schedule Exam</span></button>
                <button onclick="navigate('students')" class="p-3 rounded-lg bg-gray-50 hover:bg-blue-50 text-sm font-medium text-gray-700 hover:text-blue-700 text-left flex items-center space-x-2"><i class="fas fa-plus text-blue-500"></i><span>Add Student</span></button>
              </div>
            </div>
          </div>`;
      } catch(e) { showToast(e.message, 'error'); }
    }

    async function renderProposals() {
      const area = document.getElementById('content-area');
      try {
        const data = await api.get('/cancellation-proposals?limit=1000');
        const items = data.data.proposals || [];
        area.innerHTML = `
          <div class="mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="relative flex-1 sm:w-64">
              <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
              <input type="text" id="search-proposals" placeholder="Search proposals..." oninput="filterTable('search-proposals', '#table-proposals')" onkeydown="if(event.key==='Enter'){event.preventDefault();filterTable('search-proposals', '#table-proposals');}" class="w-full pl-9 pr-8 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition">
              <button type="button" onclick="clearSearch('search-proposals', filterTable, '#table-proposals')" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 transition-colors p-1" title="Clear search">
                <i class="fas fa-times text-xs"></i>
              </button>
            </div>
            <button type="button" onclick="filterTable('search-proposals', '#table-proposals')" class="px-4 py-2 bg-university-600 hover:bg-university-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors flex items-center space-x-1">
              <i class="fas fa-search text-xs"></i><span>Search</span>
            </button>
            <span class="text-sm text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-200 whitespace-nowrap"><i class="fas fa-clipboard-question mr-1 text-gray-400"></i> ${items.length} proposals</span>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table id="table-proposals" class="min-w-full divide-y divide-gray-200 university-table">
              <thead>
                <tr>
                  <th class="px-6 py-3 text-left"><i class="fas fa-user-tie mr-1 opacity-70"></i>Supervisor</th>
                  <th class="px-6 py-3 text-left"><i class="fas fa-book mr-1 opacity-70"></i>Exam</th>
                  <th class="px-6 py-3 text-left"><i class="fas fa-door-open mr-1 opacity-70"></i>Hall</th>
                  <th class="px-6 py-3 text-left"><i class="fas fa-comment mr-1 opacity-70"></i>Reason</th>
                  <th class="px-6 py-3 text-left"><i class="fas fa-info-circle mr-1 opacity-70"></i>Status</th>
                  <th class="px-6 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-gray-200">
                ${items.map(p => {
                  const exam = p.exam_hall_id && p.exam_hall_id.exam_id || {};
                  const hall = p.exam_hall_id && p.exam_hall_id.hall_id || {};
                  const subject = exam.subject_id || {};
                  const statusClass = p.status==='pending' ? 'bg-yellow-100 text-yellow-700' : p.status==='approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                  return `<tr class="table-row transition-colors">
                    <td class="px-6 py-4 text-sm text-gray-900 font-medium">${p.supervisor_id && p.supervisor_id.full_name || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${subject.subject_name || '-'} (${formatDate(exam.exam_date)})</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${hall.hall_name || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" title="${p.reason}">${p.reason}</td>
                    <td class="px-6 py-4 text-sm"><span class="px-3 py-1 rounded-full text-xs font-semibold ${statusClass}"><i class="fas fa-circle text-[8px] mr-1"></i>${p.status}</span></td>
                    <td class="px-6 py-4 text-right text-sm font-medium space-x-2">
                      ${p.status === 'pending' ? `
                        <button onclick="openApproveProposalModal('${p._id}', '${(p.supervisor_id && p.supervisor_id.full_name || '').replace(/'/g, "\'")}', '${(hall.hall_name || '').replace(/'/g, "\'")}')" class="text-green-600 hover:text-green-800 transition-colors font-medium" title="Approve"><i class="fas fa-check mr-1"></i>Approve</button>
                        <button onclick="openDeclineProposalModal('${p._id}')" class="text-red-500 hover:text-red-700 transition-colors font-medium" title="Decline"><i class="fas fa-times mr-1"></i>Decline</button>
                      ` : '<span class="text-gray-400 text-xs"><i class="fas fa-check-double mr-1"></i>Resolved</span>'}
                      <button onclick="deleteProposal('${p._id}')" class="text-gray-500 hover:text-red-700 transition-colors ml-2" title="Delete"><i class="fas fa-trash-alt"></i></button>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            ${items.length === 0 ? '<div class="text-center py-12 text-gray-500"><i class="fas fa-inbox text-4xl mb-3 text-gray-300"></i><p>No proposals found</p></div>' : ''}
          </div>`;
      } catch(e) { showToast(e.message, 'error'); }
    }

    async function renderPasswordResetRequests() {
      const area = document.getElementById('content-area');
      try {
        const data = await api.get('/password-reset-requests?limit=1000');
        const items = data.data.requests || [];
        area.innerHTML = `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden"><table id="table-password-resets" class="min-w-full divide-y divide-gray-200 university-table"><thead><tr><th class="px-6 py-3 text-left">Email</th><th class="px-6 py-3 text-left">User Type</th><th class="px-6 py-3 text-left">Message</th><th class="px-6 py-3 text-left">Requested</th><th class="px-6 py-3 text-left">Status</th><th class="px-6 py-3 text-right">Actions</th></tr></thead><tbody class="divide-y divide-gray-200">${items.map(request => { const statusClass = request.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : request.status === 'approved' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'; return `<tr class="table-row"><td class="px-6 py-4 text-sm text-gray-900">${escapeHtml(request.email)}</td><td class="px-6 py-4 text-sm text-gray-700 capitalize">${request.requester_type}</td><td class="px-6 py-4 text-sm text-gray-600 max-w-sm whitespace-normal break-words">${escapeHtml(request.message) || '-'}</td><td class="px-6 py-4 text-sm text-gray-500">${formatDateTime(request.createdAt)}</td><td class="px-6 py-4 text-sm"><span class="px-3 py-1 rounded-full text-xs font-semibold ${statusClass}">${request.status}</span></td><td class="px-6 py-4 text-right text-sm font-medium space-x-2">${request.status === 'pending' ? `<button onclick="approvePasswordReset('${request._id}')" class="text-green-600 hover:text-green-800" title="Approve"><i class="fas fa-check"></i></button><button onclick="declinePasswordReset('${request._id}')" class="text-red-500 hover:text-red-700" title="Decline"><i class="fas fa-times"></i></button>` : ''}<button onclick="deletePasswordReset('${request._id}')" class="text-gray-500 hover:text-red-700" title="Delete"><i class="fas fa-trash-alt"></i></button></td></tr>`; }).join('')}</tbody></table>${items.length === 0 ? '<div class="text-center py-12 text-gray-500"><i class="fas fa-inbox text-4xl mb-3 text-gray-300"></i><p>No password reset requests</p></div>' : ''}</div>`;
      } catch (error) { showToast(error.message, 'error'); }
    }

    function approvePasswordReset(requestId) {

        examType: [{label:'Type Name', key:'type_name', icon:'fa-tag'}],
        building: [{label:'Name', key:'building_name', icon:'fa-building'}, {label:'Location', key:'location', icon:'fa-map-marker-alt'}],

        supervisor: [{label:'Name', key:'full_name', icon:'fa-user-tie'}, {label:'Email', key:'email', icon:'fa-envelope'}, {label:'Phone', key:'phone', icon:'fa-phone'}],
        admin: [{label:'Name', key:'full_name', icon:'fa-user-shield'}, {label:'Email', key:'email', icon:'fa-envelope'}],

function getValue(obj, path, type) {
  const val = path.split('.').reduce((o,p) => o && o[p], obj);
  if (type === 'date') return formatDate(val);
  if (typeof val === 'boolean') return val ? 'Yes' : 'No';
  return val || '-';
}

      try {
        const res = await api.get(endpoint + (endpoint.includes('?') ? '&' : '?') + 'limit=1000');
        let items = [];
        if (Array.isArray(res.data)) items = res.data;
        else { const key = Object.keys(res.data).find(k => Array.isArray(res.data[k])); items = key ? res.data[key] : []; }
        select.innerHTML = '<option value="">-- Select --</option>' + items.map(item => `<option value="${item[valueField]}">${item[labelField] || item.name || item._id}</option>`).join('');
      } catch (e) { select.innerHTML = '<option value="">Failed to load</option>'; }
    }

    async function populateMultiSelect(selectId, endpoint, labelField, valueField) {
      valueField = valueField || '_id';
      const select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '';
      try {
        const res = await api.get(endpoint + (endpoint.includes('?') ? '&' : '?') + 'limit=1000');
        let items = [];
        if (Array.isArray(res.data)) items = res.data;
        else { const key = Object.keys(res.data).find(k => Array.isArray(res.data[k])); items = key ? res.data[key] : []; }
        items.forEach(item => { const option = document.createElement('option'); option.value = item[valueField]; option.textContent = item[labelField] || item.name || item._id; select.appendChild(option); });
      } catch (e) { select.innerHTML = '<option value="">Failed to load</option>'; }
    }

    function openModal(title, html, onSave) {
      document.getElementById('modal-title').innerHTML = `<i class="fas fa-edit text-university-500 mr-2"></i><span>${title}</span>`;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-footer').style.display = 'flex';
      document.querySelectorAll('#modal-body input[type="number"]').forEach(input => {
        input.addEventListener('input', () => {
          if (input.value === '') return;
          const minimum = Number(input.min || 0);
          const value = Number(input.value);
          if (!Number.isFinite(value) || value < minimum) input.value = minimum;
        });
      });
      document.getElementById('modal-save').onclick = async () => {
        try { await onSave(); closeModal(); renderView(); showToast('Saved successfully'); }
        catch(err) { showToast(err.message || 'Failed to save', 'error'); }
      };
    }

          if (studentIds.length === 0) throw new Error('Please select at least one student');

          return;
        }
        const body = {};
        const missing = [];
        document.querySelectorAll('#modal-body input, #modal-body select').forEach(el => {
          const field = el.id.replace('f-', '');
          if (el.type === 'checkbox') body[field] = el.checked;
          else if (el.type === 'number') {
            const value = Number(el.value);
            const minimum = Number(el.min || 0);
            if (!Number.isInteger(value) || value < minimum) throw new Error(`${field} must be at least ${minimum}`);
            body[field] = value;
          }
          else body[field] = el.value.trim();
          if (el.tagName === 'SELECT' && el.value === '') missing.push(field);
          else if (el.type !== 'checkbox' && el.type !== 'number' && !el.value.trim()) missing.push(field);
        });
        if (missing.length > 0) throw new Error('Please fill in: ' + missing.join(', '));
        const endpoint = type === 'examType' ? 'exam-types' : type + 's';

    async function populateEnrollmentStudents() {
      const list = document.getElementById('enrollment-student-list');
      const search = document.getElementById('enrollment-student-search');
      if (!list || !search) return;
      try {
        const response = await api.get('/students?limit=1000');
        const students = response.data.students || response.data;
        const selectedStudentIds = new Set();
        const render = () => {
          const query = search.value.trim().toLowerCase();
          const visibleStudents = students.filter(student => `${student.full_name} ${student.university_number}`.toLowerCase().includes(query));
          list.innerHTML = visibleStudents.length
            ? visibleStudents.map(student => `<label class="flex items-center gap-2 p-2 rounded hover:bg-gray-50 cursor-pointer"><input type="checkbox" value="${student._id}" ${selectedStudentIds.has(student._id) ? 'checked' : ''} class="enrollment-student-checkbox w-4 h-4 text-university-600 rounded focus:ring-university-500"><span class="text-sm text-gray-700">${escapeHtml(student.full_name)} <span class="text-gray-400">(${escapeHtml(student.university_number)})</span></span></label>`).join('')
            : '<p class="text-sm text-gray-500 p-2">No students found</p>';
          list.querySelectorAll('.enrollment-student-checkbox').forEach(input => input.addEventListener('change', () => input.checked ? selectedStudentIds.add(input.value) : selectedStudentIds.delete(input.value)));
        };
        search.addEventListener('input', render);
        render();
      } catch (error) {
        list.innerHTML = '<p class="text-sm text-red-500 p-2">Failed to load students</p>';
      }
    }

          <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-play text-gray-400 mr-1"></i> Start Time</label><input id="f-start_time" placeholder="HH:MM" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div><div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-stop text-gray-400 mr-1"></i> End Time</label><input id="f-end_time" placeholder="HH:MM" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-door-open text-indigo-500 mr-1"></i> Select Halls</label><input id="search-exam-halls" type="search" placeholder="Search halls" class="w-full px-3 py-2 mb-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"><div id="f-hall_ids" class="max-h-32 overflow-y-auto border border-gray-200 rounded-lg p-2"><p class="text-sm text-gray-500 p-2">Loading halls...</p></div></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-user-tie text-emerald-500 mr-1"></i> Select Supervisor Pool</label><input id="search-exam-supervisors" type="search" placeholder="Search supervisors" class="w-full px-3 py-2 mb-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"><div id="f-supervisor_ids" class="max-h-32 overflow-y-auto border border-gray-200 rounded-lg p-2"><p class="text-sm text-gray-500 p-2">Loading supervisors...</p></div></div>
          <div id="head-supervisors-section" class="space-y-3 hidden"><label class="block text-sm font-medium text-gray-700"><i class="fas fa-crown text-yellow-500 mr-1"></i> Head Supervisors</label><p class="text-xs text-gray-500">Select one head supervisor for each hall</p><div id="head-supervisors-list" class="space-y-2"></div></div>
        </div>`, 
        async () => {
          const hallIds = Array.from(document.querySelectorAll('#f-hall_ids input:checked')).map(input => input.value);
          const supervisorIds = Array.from(document.querySelectorAll('#f-supervisor_ids input:checked')).map(input => input.value);
          if (hallIds.length === 0) throw new Error('Please select at least one hall');
          if (supervisorIds.length === 0) throw new Error('Please select at least one supervisor');
          if (supervisorIds.length < hallIds.length) throw new Error('Need at least as many supervisors as halls');
          const headSupervisors = [];
          for (let i = 0; i < hallIds.length; i++) {
            const hallId = hallIds[i];
            const select = document.getElementById('head-for-' + hallId);
            const headId = select ? select.value : '';
            if (!headId) throw new Error('Please select a head supervisor for all halls');
            if (!supervisorIds.includes(headId)) throw new Error('Head supervisor must be from the selected pool');
            headSupervisors.push({ hall_id: hallId, supervisor_id: headId });
          }
          const headIds = headSupervisors.map(h => h.supervisor_id);
          if (new Set(headIds).size !== headIds.length) {
            throw new Error('Each hall must have a different head supervisor');
          }
          await api.post('/exams', {
            subject_id: document.getElementById('f-subject_id').value,
            exam_type_id: document.getElementById('f-exam_type_id').value,
            exam_date: document.getElementById('f-exam_date').value,
            start_time: document.getElementById('f-start_time').value,
            end_time: document.getElementById('f-end_time').value,
            hall_ids: hallIds,
            supervisor_ids: supervisorIds,
            head_supervisors: headSupervisors,
          });
        }
      );
      populateSelect('f-subject_id', '/subjects', 'subject_name');
      populateSelect('f-exam_type_id', '/exam-types', 'type_name');
      populateCheckboxList('f-hall_ids', 'search-exam-halls', '/halls', 'hall_name', 'exam-hall-checkbox', updateHeadSection);
      populateCheckboxList('f-supervisor_ids', 'search-exam-supervisors', '/supervisors', 'full_name', 'exam-supervisor-checkbox', updateHeadSection);
      function updateHeadSection() {
          const hallList = document.getElementById('f-hall_ids');
          const supList = document.getElementById('f-supervisor_ids');
          const section = document.getElementById('head-supervisors-section');
          const list = document.getElementById('head-supervisors-list');
          const halls = Array.from(hallList.querySelectorAll('input:checked')).map(input => ({ value: input.value, text: input.dataset.label }));
          const supervisors = Array.from(supList.querySelectorAll('input:checked')).map(input => ({ value: input.value, text: input.dataset.label }));
          if (halls.length === 0 || supervisors.length === 0) { section.classList.add('hidden'); return; }
          section.classList.remove('hidden');
          list.innerHTML = halls.map(hall => `<div class="flex items-center space-x-3 bg-gray-50 p-3 rounded-lg"><span class="text-sm font-medium text-gray-700 w-32 truncate"><i class="fas fa-door-open text-indigo-400 mr-1"></i>${escapeHtml(hall.text)}</span><select id="head-for-${hall.value}" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg bg-white text-sm focus:ring-2 focus:ring-university-500 outline-none transition"><option value="">-- Select Head --</option>${supervisors.map(sup => `<option value="${sup.value}">${escapeHtml(sup.text)}</option>`).join('')}</select></div>`).join('');
        }
    }

    async function populateCheckboxList(listId, searchId, endpoint, labelField, checkboxClass, onChange) {
      const list = document.getElementById(listId);
      const search = document.getElementById(searchId);
      if (!list || !search) return;
      try {
        const response = await api.get(endpoint + '?limit=1000');
        const key = Object.keys(response.data).find(name => Array.isArray(response.data[name]));
        const items = Array.isArray(response.data) ? response.data : (key ? response.data[key] : []);
        const selectedIds = new Set();
        const render = () => {
          const query = search.value.trim().toLowerCase();
          const visibleItems = items.filter(item => String(item[labelField] || '').toLowerCase().includes(query));
          list.innerHTML = visibleItems.length
            ? visibleItems.map(item => `<label class="flex items-center gap-2 p-2 rounded hover:bg-gray-50 cursor-pointer"><input type="checkbox" value="${item._id}" data-label="${escapeHtml(item[labelField])}" ${selectedIds.has(item._id) ? 'checked' : ''} class="${checkboxClass} w-4 h-4 text-university-600 rounded focus:ring-university-500"><span class="text-sm text-gray-700">${escapeHtml(item[labelField])}</span></label>`).join('')
            : '<p class="text-sm text-gray-500 p-2">No results found</p>';
          list.querySelectorAll('input[type="checkbox"]').forEach(input => input.addEventListener('change', () => { if (input.checked) selectedIds.add(input.value); else selectedIds.delete(input.value); onChange(); }));
          onChange();
        };
        search.addEventListener('input', render);
        render();
      } catch (error) {
        list.innerHTML = '<p class="text-sm text-red-500 p-2">Failed to load options</p>';
      }
    }

    function openAutoAssignModal(examId) {

        if (supervisorIds.length === 0) throw new Error('Please select at least one supervisor');
        if (supervisorIds.length < hallIds.length) throw new Error('Need at least as many supervisors as halls');

        await api.post('/exams/' + examId + '/auto-assign-supervisors', { supervisor_ids: supervisorIds, head_supervisors: headSupervisors });

      populateCheckboxList('f-hall_ids', 'search-auto-halls', '/halls', 'hall_name', 'exam-hall-checkbox', updateAutoAssignHeads);

      function updateAutoAssignHeads() {

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
    }

    function openEditModal(type, id) {
      const item = currentData.find(record => record._id === id);
      if (!item) return showToast('Record not found', 'error');
      if (type === 'subject') {
        const semesterId = item.semester_id && item.semester_id._id || item.semester_id || '';
        const form = `<div class="space-y-4"><div><label class="block text-sm font-medium text-gray-700 mb-1">Subject Code</label><input id="edit-subject_code" value="${escapeHtml(item.subject_code)}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Subject Name</label><input id="edit-subject_name" value="${escapeHtml(item.subject_name)}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Credit Hours</label><input id="edit-credit_hours" type="number" min="1" max="10" value="${item.credit_hours}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">Level Year</label><input id="edit-level_year" type="number" min="1" max="10" value="${item.level_year}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div><label class="flex items-center p-3 bg-gray-50 rounded-lg cursor-pointer"><input id="edit-is_mandatory" type="checkbox" ${item.is_mandatory !== false ? 'checked' : ''} class="mr-3 w-4 h-4 text-university-600 rounded focus:ring-university-500"><span class="text-sm font-medium text-gray-700">Mandatory Subject</span></label><div><label class="block text-sm font-medium text-gray-700 mb-1">Semester</label><select id="edit-semester_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-university-500 outline-none transition"></select></div></div>`;
        openModal('Edit Subject', form, async () => {
          const creditHours = Number(document.getElementById('edit-credit_hours').value);
          const levelYear = Number(document.getElementById('edit-level_year').value);
          const subjectCode = document.getElementById('edit-subject_code').value.trim();
          const subjectName = document.getElementById('edit-subject_name').value.trim();
          const semester = document.getElementById('edit-semester_id').value;
          if (!subjectCode || !subjectName || !semester) throw new Error('Please fill in all fields');
          if (![creditHours, levelYear].every(value => Number.isInteger(value) && value >= 1 && value <= 10)) throw new Error('Credit hours and level year must be between 1 and 10');
          await api.patch('/subjects/' + id, { subject_code: subjectCode, subject_name: subjectName, credit_hours: creditHours, level_year: levelYear, is_mandatory: document.getElementById('edit-is_mandatory').checked, semester_id: semester });
        });
        populateSelect('edit-semester_id', '/semesters', 'name').then(() => { document.getElementById('edit-semester_id').value = semesterId; });
        return;
      }
      const isStudent = type === 'student';
      const fields = isStudent
        ? [['full_name', 'Full Name', 'text', item.full_name], ['phone', 'Phone Number', 'text', item.phone], ['current_level', 'Current Level', 'number', item.current_level]]
        : [['full_name', 'Full Name', 'text', item.full_name], ['phone', 'Phone Number', 'text', item.phone]];
      const form = `<div class="space-y-4">${fields.map(([key, label, inputType, value]) => `<div><label class="block text-sm font-medium text-gray-700 mb-1">${label}</label><input id="edit-${key}" type="${inputType}" value="${escapeHtml(value)}" ${key === 'current_level' ? 'min="1" max="5"' : ''} class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></div>`).join('')}</div>`;
      openModal('Edit ' + (isStudent ? 'Student' : 'Supervisor'), form, async () => {
        const body = {};
        fields.forEach(([key, , inputType]) => {
          const input = document.getElementById('edit-' + key);
          if (inputType === 'number') {
            const value = Number(input.value);
            if (!Number.isInteger(value) || value < Number(input.min) || value > Number(input.max)) throw new Error('Current level must be between 1 and 5');
            body[key] = value;
          } else {
            body[key] = input.value.trim();
            if (!body[key]) throw new Error('Please fill in all fields');
          }
        });
        await api.patch('/' + (isStudent ? 'students' : 'supervisors') + '/' + id, body);
      });
    }

    async function deleteItem(endpoint, id) {
      const warnings = { 'students': 'This will also delete all enrollments, seat assignments, and notifications for this student.', 'subjects': 'This will also delete all exams, enrollments, seat assignments, and notifications for this subject.', 'exams': 'This will also delete all seat assignments, supervisor assignments, and notifications for this exam.', 'halls': 'This will also delete all seats in this hall.', 'seat-assignments': 'This will also delete related notifications.' };
      const warning = warnings[endpoint] || '';
      const msg = warning ? 'Are you sure?\n\n' + warning + '\n\nThis action cannot be undone.' : 'Are you sure?';
      if (!confirm(msg)) return;
      try { await api.delete('/' + endpoint + '/' + id); renderView(); showToast('Deleted successfully'); }
      catch(err) { showToast(err.message, 'error'); }
    }

        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal-footer').style.display = 'none';
      } catch (err) {
        showToast(err.message || 'Failed to load exam details', 'error');
        console.error('Exam details error:', err);
      }
    }

    function openApproveProposalModal(proposalId, supervisorName, hallName) {
      openModal('Approve Cancellation Request',
        `<div class="space-y-4">
          <p class="text-sm text-gray-600">You are approving the cancellation request from <strong>${supervisorName}</strong> for <strong>${hallName}</strong>.</p>
          <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-user-tie text-emerald-500 mr-1"></i> Replacement Supervisor</label><select id="f-replacement_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-university-500 outline-none transition"><option value="">Loading supervisors...</option></select></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-comment text-gray-400 mr-1"></i> Response to Supervisor (optional)</label><textarea id="f-admin_response" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></textarea></div>
        </div>`,
        async () => {
          const replacementId = document.getElementById('f-replacement_id').value;
          const response = document.getElementById('f-admin_response').value.trim();
          if (!replacementId) throw new Error('Please select a replacement supervisor');
          await api.patch('/cancellation-proposals/' + proposalId + '/approve', { replacement_supervisor_id: replacementId, admin_response: response });
          showToast('Request approved and replacement assigned');
        }
      );
      const select = document.getElementById('f-replacement_id');
      api.get('/supervisors?limit=1000').then(res => {
        const supervisors = res.data.supervisors || [];
        select.innerHTML = '<option value="">-- Select Replacement --</option>' + supervisors.map(s => `<option value="${s._id}">${s.full_name} (${s.email})</option>`).join('');
      }).catch(() => { select.innerHTML = '<option value="">Failed to load</option>'; });
    }

    function openDeclineProposalModal(proposalId) {
      openModal('Decline Cancellation Request',
        `<div class="space-y-4">
          <p class="text-sm text-gray-600">The supervisor will be notified that their request has been declined.</p>
          <div><label class="block text-sm font-medium text-gray-700 mb-1"><i class="fas fa-comment text-gray-400 mr-1"></i> Reason for declining (optional)</label><textarea id="f-admin_response" rows="3" placeholder="Explain why the request is declined..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-university-500 outline-none transition"></textarea></div>
        </div>`,
        async () => {
          const response = document.getElementById('f-admin_response').value.trim();
          await api.patch('/cancellation-proposals/' + proposalId + '/decline', { admin_response: response });
          showToast('Request declined');
        }
      );
    }

    renderView();
  </script>
</body>
</html>
