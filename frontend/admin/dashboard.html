<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Exam Seating System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex h-screen">
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
      <div class="p-6 border-b">
        <span class="text-xl font-bold text-gray-900">ExamSeating</span>
        <span class="block text-xs text-gray-500 mt-1">Admin Portal</span>
      </div>
      <nav class="flex-1 overflow-y-auto p-4 space-y-1">
        <button onclick="navigate('dashboard')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Dashboard</button>
        <button onclick="navigate('students')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Students</button>
        <button onclick="navigate('semesters')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Semesters</button>
        <button onclick="navigate('subjects')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Subjects</button>
        <button onclick="navigate('enrollments')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Enrollments</button>
        <button onclick="navigate('exam-types')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Exam Types</button>
        <button onclick="navigate('exams')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Exams</button>
        <button onclick="navigate('buildings')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Buildings</button>
        <button onclick="navigate('halls')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Halls</button>
        <button onclick="navigate('supervisors')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Supervisors</button>
        <button onclick="navigate('seat-assignments')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Seat Assignments</button>
        <button onclick="navigate('proposals')" class="sidebar-link w-full text-left px-4 py-2 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancellation Proposals</button>
      </nav>
      <div class="p-4 border-t">
        <div class="flex items-center justify-between">
          <span id="userName" class="text-sm text-gray-600 truncate"></span>
          <button onclick="logout('admin')" class="text-sm text-red-600 hover:text-red-800 font-medium">Logout</button>
        </div>
      </div>
    </aside>

    <main class="flex-1 overflow-y-auto">
      <div class="p-8">
        <div id="page-header" class="mb-8">
          <h1 id="page-title" class="text-2xl font-bold text-gray-900">Dashboard</h1>
          <p id="page-desc" class="text-gray-500 mt-1">Overview of the examination system</p>
        </div>
        <div id="content-area"></div>
      </div>
    </main>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto relative z-10">
        <div class="p-6 border-b flex items-center justify-between">
          <h3 id="modal-title" class="text-lg font-semibold text-gray-900">Create</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modal-body" class="p-6"></div>
        <div id="modal-footer" class="p-6 border-t bg-gray-50 rounded-b-2xl flex justify-end space-x-3">
          <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
          <button id="modal-save" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const api = checkAuth('admin');
    if (!api) window.location.href = '/admin/login.html';
    const user = JSON.parse(localStorage.getItem('admin_user') || '{}');
    document.getElementById('userName').textContent = user.full_name || 'Admin';

    let currentView = 'dashboard';

    function navigate(view) {
      currentView = view;
      document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      renderView();
    }

    function renderView() {
      const area = document.getElementById('content-area');
      const title = document.getElementById('page-title');
      const desc = document.getElementById('page-desc');
      area.innerHTML = '<div class="text-center py-12"><div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div></div>';

      switch(currentView) {
        case 'dashboard': renderDashboard(); break;
        case 'students': title.textContent='Students'; desc.textContent='Manage student accounts'; renderCrud('students', 'student'); break;
        case 'semesters': title.textContent='Semesters'; desc.textContent='Academic terms'; renderCrud('semesters', 'semester'); break;
        case 'subjects': title.textContent='Subjects'; desc.textContent='Courses and curriculum'; renderCrud('subjects', 'subject'); break;
        case 'enrollments': title.textContent='Enrollments'; desc.textContent='Student subject registrations'; renderCrud('enrollments', 'enrollment'); break;
        case 'exam-types': title.textContent='Exam Types'; desc.textContent='Categories of examinations'; renderCrud('exam-types', 'examType'); break;
        case 'exams': title.textContent='Exams'; desc.textContent='Schedule and manage exams'; renderExams(); break;
        case 'buildings': title.textContent='Buildings'; desc.textContent='Campus buildings'; renderCrud('buildings', 'building'); break;
        case 'halls': title.textContent='Halls'; desc.textContent='Examination venues'; renderCrud('halls', 'hall'); break;
        case 'supervisors': title.textContent='Supervisors'; desc.textContent='Examination staff'; renderCrud('supervisors', 'supervisor'); break;
        case 'seat-assignments': title.textContent='Seat Assignments'; desc.textContent='Manual seat allocation'; renderSeatAssignments(); break;
        case 'proposals': title.textContent='Cancellation Proposals'; desc.textContent='Supervisor cancellation requests'; renderProposals(); break;
      }
    }

    async function renderDashboard() {
      document.getElementById('page-title').textContent = 'Dashboard';
      document.getElementById('page-desc').textContent = 'System overview';
      try {
        const [students, exams, halls, supervisors] = await Promise.all([
          api.get('/students?limit=1'), api.get('/exams?limit=1'),
          api.get('/halls?limit=1'), api.get('/supervisors?limit=1')
        ]);
        document.getElementById('content-area').innerHTML = `
          <div class="grid md:grid-cols-4 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
              <p class="text-sm text-gray-500">Total Students</p>
              <p class="text-3xl font-bold text-gray-900 mt-2">${students.data.total || 0}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
              <p class="text-sm text-gray-500">Scheduled Exams</p>
              <p class="text-3xl font-bold text-gray-900 mt-2">${exams.data.total || 0}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
              <p class="text-sm text-gray-500">Halls</p>
              <p class="text-3xl font-bold text-gray-900 mt-2">${halls.data.total || 0}</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
              <p class="text-sm text-gray-500">Supervisors</p>
              <p class="text-3xl font-bold text-gray-900 mt-2">${supervisors.data.total || 0}</p>
            </div>
          </div>
        `;
      } catch(e) {
        showToast(e.message, 'error');
      }
    }

    async function renderProposals() {
  const area = document.getElementById('content-area');
  try {
    const data = await api.get('/cancellation-proposals');
    const items = data.data.proposals || [];
    area.innerHTML = `
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Supervisor</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Exam</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Hall</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Reason</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            ${items.map(p => {
              const exam = p.exam_hall_id?.exam_id || {};
              const hall = p.exam_hall_id?.hall_id || {};
              const subject = exam.subject_id || {};
              return '<tr class="table-row">' +
                '<td class="px-6 py-4 text-sm text-gray-900">' + (p.supervisor_id?.full_name || '-') + '</td>' +
                '<td class="px-6 py-4 text-sm text-gray-900">' + (subject.subject_name || '-') + ' (' + formatDate(exam.exam_date) + ')</td>' +
                '<td class="px-6 py-4 text-sm text-gray-900">' + (hall.hall_name || '-') + '</td>' +
                '<td class="px-6 py-4 text-sm text-gray-500 max-w-xs truncate" title="' + p.reason + '">' + p.reason + '</td>' +
                '<td class="px-6 py-4 text-sm"><span class="px-2 py-1 rounded-full text-xs font-medium ' + (p.status==='pending'?'bg-yellow-100 text-yellow-700':p.status==='approved'?'bg-green-100 text-green-700':'bg-red-100 text-red-700') + '">' + p.status + '</span></td>' +
                '<td class="px-6 py-4 text-right text-sm font-medium space-x-2">' +
                  (p.status === 'pending' ? 
                    '<button onclick="openApproveProposalModal(\'' + p._id + '\', \'' + (p.supervisor_id?.full_name || '') + '\', \'' + (hall.hall_name || '') + '\')" class="text-green-600 hover:text-green-900 font-medium">Approve</button>' +
                    '<button onclick="openDeclineProposalModal(\'' + p._id + '\')" class="text-red-600 hover:text-red-900 font-medium">Decline</button>'
                    : '<span class="text-gray-400 text-xs">Resolved</span>'
                  ) +
                '</td>' +
              '</tr>';
            }).join('')}
          </tbody>
        </table>
        ${items.length === 0 ? '<div class="text-center py-8 text-gray-500">No proposals found</div>' : ''}
      </div>
    `;
  } catch(e) { showToast(e.message, 'error'); }
}

    async function renderCrud(endpoint, type) {
      const area = document.getElementById('content-area');
      try {
        const data = await api.get(`/${endpoint}`);
        let items = [];
        if (Array.isArray(data.data)) {
          items = data.data;
        } else {
          items = data.data[type + 's'] || data.data[type + 'Types'] || data.data.assignments || data.data.enrollments || [];
        }
        let fields = getFields(type);
        area.innerHTML = `
          <div class="mb-4 flex justify-between items-center">
            <button onclick="openCreateModal('${type}')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Add New</button>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50"><tr>${fields.map(f => `<th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">${f.label}</th>`).join('')}<th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th></tr></thead>
              <tbody class="divide-y divide-gray-200">${items.map(item => `<tr class="table-row">${fields.map(f => `<td class="px-6 py-4 text-sm text-gray-900">${getValue(item, f.key)}</td>`).join('')}<td class="px-6 py-4 text-right text-sm font-medium space-x-2"><button onclick="deleteItem('${endpoint}', '${item._id}')" class="text-red-600 hover:text-red-900">Delete</button></td></tr>`).join('')}</tbody>
            </table>
            ${items.length === 0 ? '<div class="text-center py-8 text-gray-500">No records found</div>' : ''}
          </div>
        `;
      } catch(e) { showToast(e.message, 'error'); }
    }

    function getFields(type) {
      const map = {
        student: [{label:'Name',key:'full_name'},{label:'University #',key:'university_number'},{label:'Email',key:'email'},{label:'Level',key:'current_level'}],
        semester: [{label:'Name',key:'name'},{label:'Year',key:'academic_year'},{label:'Start',key:'start_date'},{label:'End',key:'end_date'}],
        subject: [{label:'Code',key:'subject_code'},{label:'Name',key:'subject_name'},{label:'Credits',key:'credit_hours'},{label:'Level',key:'level_year'}],
        enrollment: [{label:'Student',key:'student_id.full_name'},{label:'Subject',key:'subject_id.subject_code'},{label:'Retake',key:'is_retake'},{label:'Status',key:'status'}],
        examType: [{label:'Type Name',key:'type_name'}],
        building: [{label:'Name',key:'building_name'},{label:'Location',key:'location'}],
        hall: [{label:'Name',key:'hall_name'},{label:'Building',key:'building_id.building_name'},{label:'Capacity',key:'capacity'},{label:'Grid',key:'rows_count'}],
        supervisor: [{label:'Name',key:'full_name'},{label:'Email',key:'email'},{label:'Phone',key:'phone'}],
      };
      return map[type] || [];
    }

    function getValue(obj, path) {
      return path.split('.').reduce((o,p) => o?.[p], obj) || '-';
    }

    async function renderExams() {
      const area = document.getElementById('content-area');
      try {
        const [exams, subjects, examTypes] = await Promise.all([
          api.get('/exams'), api.get('/subjects'), api.get('/exam-types')
        ]);
        const items = exams.data.exams || [];
        area.innerHTML = `
          <div class="mb-4 flex justify-between items-center">
            <button onclick="openCreateExamModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Schedule Exam</button>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subject</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Time</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th></tr></thead>
              <tbody class="divide-y divide-gray-200">${items.map(item => `<tr class="table-row"><td class="px-6 py-4 text-sm text-gray-900">${item.subject_id?.subject_name || '-'}</td><td class="px-6 py-4 text-sm text-gray-900">${item.exam_type_id?.type_name || '-'}</td><td class="px-6 py-4 text-sm text-gray-900">${formatDate(item.exam_date)}</td><td class="px-6 py-4 text-sm text-gray-900">${item.start_time} - ${item.end_time}</td><td class="px-6 py-4 text-sm"><span class="px-2 py-1 rounded-full text-xs font-medium ${item.status==='scheduled'?'bg-blue-100 text-blue-700':item.status==='completed'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-700'}">${item.status}</span></td><td class="px-6 py-4 text-right text-sm font-medium space-x-2"><button onclick="openExamDetailsModal('${item._id}')" class="text-blue-600 hover:text-blue-900">Details</button><button onclick="deleteItem('exams', '${item._id}')" class="text-red-600 hover:text-red-900">Delete</button></td></tr>`).join('')}</tbody>
            </table>
          </div>
        `;
      } catch(e) { showToast(e.message, 'error'); }
    }

    async function renderSeatAssignments() {
      const area = document.getElementById('content-area');
      try {
        const data = await api.get('/seat-assignments');
        const items = data.data.assignments || [];
        area.innerHTML = `
          <div class="mb-4 flex justify-between items-center">
            <button onclick="openCreateSeatAssignmentModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">+ Manual Assign</button>
          </div>
          <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Student</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Exam</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Hall</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Seat</th><th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Attendance</th><th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th></tr></thead>
              <tbody class="divide-y divide-gray-200">${items.map(item => `<tr class="table-row"><td class="px-6 py-4 text-sm text-gray-900">${item.student_id?.full_name || '-'}</td><td class="px-6 py-4 text-sm text-gray-900">${item.exam_id?.subject_id?.subject_name || '-'}</td><td class="px-6 py-4 text-sm text-gray-900">${item.seat_id?.hall_id?.hall_name || '-'}</td><td class="px-6 py-4 text-sm text-gray-900">${item.seat_id?.seat_label || '-'}</td><td class="px-6 py-4 text-sm"><span class="px-2 py-1 rounded-full text-xs font-medium ${item.attendance_status==='present'?'bg-green-100 text-green-700':item.attendance_status==='absent'?'bg-red-100 text-red-700':'bg-gray-100 text-gray-700'}">${item.attendance_status}</span></td><td class="px-6 py-4 text-right text-sm font-medium"><button onclick="deleteItem('seat-assignments', '${item._id}')" class="text-red-600 hover:text-red-900">Delete</button></td></tr>`).join('')}</tbody>
            </table>
          </div>
        `;
      } catch(e) { showToast(e.message, 'error'); }
    }

    async function populateSelect(selectId, endpoint, labelField, valueField) {
      valueField = valueField || '_id';
      const select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '<option value="">Loading...</option>';
      try {
        const res = await api.get(endpoint);
        let items = [];
        if (Array.isArray(res.data)) {
          items = res.data;
        } else {
          const key = Object.keys(res.data).find(k => Array.isArray(res.data[k]));
          items = key ? res.data[key] : [];
        }
        select.innerHTML = '<option value="">-- Select --</option>' +
          items.map(item => '<option value="' + item[valueField] + '">' + (item[labelField] || item.name || item._id) + '</option>').join('');
      } catch (e) {
        select.innerHTML = '<option value="">Failed to load</option>';
      }
    }

    async function populateMultiSelect(selectId, endpoint, labelField, valueField) {
      valueField = valueField || '_id';
      const select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '';
      try {
        const res = await api.get(endpoint);
        let items = [];
        if (Array.isArray(res.data)) {
          items = res.data;
        } else {
          const key = Object.keys(res.data).find(k => Array.isArray(res.data[k]));
          items = key ? res.data[key] : [];
        }
        items.forEach(item => {
          const option = document.createElement('option');
          option.value = item[valueField];
          option.textContent = item[labelField] || item.name || item._id;
          select.appendChild(option);
        });
      } catch (e) {
        select.innerHTML = '<option value="">Failed to load</option>';
      }
    }

    function openModal(title, html, onSave) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal-footer').style.display = 'flex';
      document.getElementById('modal-save').onclick = async function() {
        try { await onSave(); closeModal(); renderView(); showToast('Saved successfully'); }
        catch(err) { showToast(err.message || 'Failed to save', 'error'); }
      };
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal-footer').style.display = 'flex';
    }

    function openCreateModal(type) {
      const forms = {
        student: '<div class="space-y-4"><input id="f-full_name" placeholder="Full Name" class="w-full px-4 py-2 border rounded-lg"><input id="f-university_number" placeholder="University Number" class="w-full px-4 py-2 border rounded-lg"><input id="f-email" type="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg"><input id="f-password" type="password" placeholder="Password" class="w-full px-4 py-2 border rounded-lg"><input id="f-current_level" type="number" placeholder="Current Level" class="w-full px-4 py-2 border rounded-lg"><input id="f-phone" placeholder="Phone" class="w-full px-4 py-2 border rounded-lg"></div>',
        semester: '<div class="space-y-4"><input id="f-name" placeholder="Name (e.g. Fall 2026)" class="w-full px-4 py-2 border rounded-lg"><input id="f-academic_year" placeholder="Academic Year" class="w-full px-4 py-2 border rounded-lg"><input id="f-start_date" type="date" class="w-full px-4 py-2 border rounded-lg"><input id="f-end_date" type="date" class="w-full px-4 py-2 border rounded-lg"></div>',
        subject: '<div class="space-y-4"><input id="f-subject_code" placeholder="Subject Code" class="w-full px-4 py-2 border rounded-lg"><input id="f-subject_name" placeholder="Subject Name" class="w-full px-4 py-2 border rounded-lg"><input id="f-credit_hours" type="number" placeholder="Credit Hours" class="w-full px-4 py-2 border rounded-lg"><input id="f-level_year" type="number" placeholder="Level Year" class="w-full px-4 py-2 border rounded-lg"><select id="f-semester_id" class="w-full px-4 py-2 border rounded-lg bg-white"><option value="">-- Select Semester --</option></select></div>',
        enrollment: '<div class="space-y-4"><select id="f-student_id" class="w-full px-4 py-2 border rounded-lg bg-white"><option value="">-- Select Student --</option></select><select id="f-subject_id" class="w-full px-4 py-2 border rounded-lg bg-white"><option value="">-- Select Subject --</option></select><label class="flex items-center"><input id="f-is_retake" type="checkbox" class="mr-2"> Is Retake</label></div>',

        document.querySelectorAll('#modal-body input, #modal-body select').forEach(function(el) {
          const field = el.id.replace('f-', '');
          if (el.type === 'checkbox') {
            body[field] = el.checked;

            body[field] = parseInt(el.value) || 0;
          } else {
            body[field] = el.value.trim();
          }
          if (el.tagName === 'SELECT' && el.value === '') {
            missing.push(field);

function openCreateSeatAssignmentModal() {
  var selectedStudentIds = [];
  
  openModal('Bulk Seat Assignment', 
    '<div class="space-y-5">' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-1">Select Exam</label><select id="f-exam_id" class="w-full px-4 py-2 border rounded-lg bg-white"><option value="">-- Select Exam --</option></select></div>' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-1">Select Hall</label><select id="f-hall_id" class="w-full px-4 py-2 border rounded-lg bg-white" disabled><option value="">-- Select exam first --</option></select><p id="seat-count" class="text-xs text-gray-500 mt-1 hidden"></p></div>' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-2">Select Students <span id="student-counter" class="text-xs font-normal text-gray-500">(0 selected)</span></label><div id="student-grid" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1"><p class="text-sm text-gray-500 col-span-2">Loading students...</p></div></div>' +
    '</div>', 
    async function() {
      const examId = document.getElementById('f-exam_id').value;
      const hallId = document.getElementById('f-hall_id').value;
      
      if (!examId) throw new Error('Please select an exam');
      if (!hallId) throw new Error('Please select a hall');
      if (selectedStudentIds.length === 0) throw new Error('Please select at least one student');
      
      const res = await api.post('/seat-assignments/bulk', {
        student_ids: selectedStudentIds,
        exam_id: examId,
        hall_id: hallId,
      });
      
      const data = res.data;
      var msg = 'Assigned ' + data.assignedCount + ' students';
      if (data.skippedCount > 0) msg += ' (' + data.skippedCount + ' already had seats)';
      showToast(msg);
    }
  );
  
  // Load exams
  const examSelect = document.getElementById('f-exam_id');
  api.get('/exams').then(function(res) {
    const exams = res.data.exams || [];
    examSelect.innerHTML = '<option value="">-- Select Exam --</option>' +
      exams.map(function(exam) {
        var subject = exam.subject_id ? exam.subject_id.subject_name : 'Unknown';
        var type = exam.exam_type_id ? exam.exam_type_id.type_name : 'Exam';
        var date = formatDate(exam.exam_date);
        return '<option value="' + exam._id + '">' + subject + ' - ' + type + ' (' + date + ')</option>';
      }).join('');
  }).catch(function() {
    examSelect.innerHTML = '<option value="">Failed to load exams</option>';
  });
  
  // Load students as clickable cards
  const studentGrid = document.getElementById('student-grid');
  api.get('/students?limit=1000').then(function(res) {
    const students = (res.data.students || []).sort(function(a, b) { return a.current_level - b.current_level || a.full_name.localeCompare(b.full_name); });
    if (students.length === 0) {
      studentGrid.innerHTML = '<p class="text-sm text-gray-500 col-span-2">No students found</p>';
      return;
    }
    
    studentGrid.innerHTML = students.map(function(s) {
      return '<div class="student-card cursor-pointer border-2 border-gray-200 rounded-lg p-3 hover:border-indigo-300 hover:bg-indigo-50 transition select-none" data-id="' + s._id + '">' +
        '<div class="flex items-center space-x-3">' +
          '<div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold">' + (s.full_name ? s.full_name.charAt(0).toUpperCase() : '?') + '</div>' +
          '<div class="min-w-0">' +
            '<p class="text-sm font-medium text-gray-900 truncate">' + s.full_name + '</p>' +
            '<p class="text-xs text-gray-500">' + s.university_number + ' • Level ' + s.current_level + '</p>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    
    // Add click handlers
    studentGrid.querySelectorAll('.student-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        if (selectedStudentIds.includes(id)) {
          selectedStudentIds = selectedStudentIds.filter(function(sid) { return sid !== id; });
          this.classList.remove('border-indigo-500', 'bg-indigo-50', 'ring-2', 'ring-indigo-200');
          this.classList.add('border-gray-200');
        } else {
          selectedStudentIds.push(id);
          this.classList.remove('border-gray-200');
          this.classList.add('border-indigo-500', 'bg-indigo-50', 'ring-2', 'ring-indigo-200');
        }
        document.getElementById('student-counter').textContent = '(' + selectedStudentIds.length + ' selected)';
      });
    });
  }).catch(function() {
    studentGrid.innerHTML = '<p class="text-sm text-red-500 col-span-2">Failed to load students</p>';
  });
  
  // When exam changes, load halls
  examSelect.addEventListener('change', async function() {
    const hallSelect = document.getElementById('f-hall_id');
    const seatCountP = document.getElementById('seat-count');
    const examId = this.value;
    
    if (!examId) {
      hallSelect.innerHTML = '<option value="">-- Select exam first --</option>';
      hallSelect.disabled = true;
      seatCountP.classList.add('hidden');
      return;
    }
    
    hallSelect.innerHTML = '<option value="">Loading halls...</option>';
    hallSelect.disabled = true;
    
    try {
      const res = await api.get('/exams/' + examId + '/details');
      const halls = res.data.halls || [];
      
      if (halls.length === 0) {
        hallSelect.innerHTML = '<option value="">No halls assigned to this exam</option>';
        return;
      }
      
      hallSelect.innerHTML = '<option value="">-- Select Hall --</option>' +
        halls.map(function(h) {
          var hallName = h.hall_id ? h.hall_id.hall_name : 'Unknown';
          var capacity = h.hall_id ? h.hall_id.capacity : '?';
          return '<option value="' + h.hall_id._id + '" data-capacity="' + capacity + '">' + hallName + ' (Capacity: ' + capacity + ')</option>';
        }).join('');
      hallSelect.disabled = false;
      
      // Show seat availability when hall changes
      hallSelect.addEventListener('change', async function() {
        const hallId = this.value;
        if (!hallId) {
          seatCountP.classList.add('hidden');
          return;
        }
        try {
          const seatRes = await api.get('/seats?hall_id=' + hallId);
          const totalSeats = (seatRes.data.seats || []).length;
          seatCountP.textContent = 'Total seats in hall: ' + totalSeats;
          seatCountP.classList.remove('hidden');
        } catch(e) {
          seatCountP.classList.add('hidden');
        }
      });
      
    } catch(e) {
      hallSelect.innerHTML = '<option value="">Failed to load halls</option>';
    }
  });
}

    async function deleteItem(endpoint, id) {
      const warnings = {
        'students': 'This will also delete all enrollments, seat assignments, and notifications for this student.',
        'subjects': 'This will also delete all exams, enrollments, seat assignments, and notifications for this subject.',
        'exams': 'This will also delete all seat assignments, supervisor assignments, and notifications for this exam.',
        'halls': 'This will also delete all seats in this hall.',
        'seat-assignments': 'This will also delete related notifications.',
      };
      
      var warning = warnings[endpoint] || '';
      var msg = warning ? 'Are you sure?\n\n' + warning + '\n\nThis action cannot be undone.' : 'Are you sure?';
        
      if (!confirm(msg)) return;
      
      try { 
        await api.delete('/' + endpoint + '/' + id); 
        renderView(); 
        showToast('Deleted successfully'); 
      }
      catch(err) { 
        showToast(err.message, 'error'); 
      }
    }

                '</div>'
              ) +
            '</div>' +
            '<div>' +
              '<h4 class="font-semibold text-gray-900 mb-2">Supervisor Assignments (' + supervisors.length + ')</h4>' +
              (supervisors.length === 0 ? '<p class="text-sm text-gray-500">No supervisors assigned yet.</p>' : 
                '<div class="max-h-48 overflow-y-auto border rounded-lg">' +
                  '<table class="min-w-full divide-y divide-gray-200 text-sm">' +
                    '<thead class="bg-gray-50 sticky top-0"><tr><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Supervisor</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Role</th><th class="px-4 py-2 text-left text-xs font-medium text-gray-500">Hall</th></tr></thead>' +
                    '<tbody class="divide-y divide-gray-200">' + supervisors.map(function(s) { return '<tr><td class="px-4 py-2">' + (s.supervisor_id ? s.supervisor_id.full_name : '-') + '</td><td class="px-4 py-2"><span class="px-2 py-0.5 rounded text-xs ' + (s.role === 'head' ? 'bg-purple-100 text-purple-700' : 'bg-emerald-100 text-emerald-700') + ' font-medium capitalize">' + s.role + '</span></td><td class="px-4 py-2 text-gray-500">' + (s.exam_hall_id && s.exam_hall_id.hall_id ? s.exam_hall_id.hall_id.hall_name : '-') + '</td></tr>'; }).join('') + '</tbody>' +
                  '</table>' +
                '</div>'
              ) +
            '</div>' +
          '</div>';

        document.getElementById('modal-title').textContent = 'Exam Details';
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modal-footer').style.display = 'none';
      } catch (err) {
        showToast(err.message || 'Failed to load exam details', 'error');
        console.error('Exam details error:', err);
      }
    }

    function openApproveProposalModal(proposalId, supervisorName, hallName) {
  openModal('Approve Cancellation Request',
    '<div class="space-y-4">' +
      '<p class="text-sm text-gray-600">You are approving the cancellation request from <strong>' + supervisorName + '</strong> for <strong>' + hallName + '</strong>.</p>' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-1">Replacement Supervisor</label><select id="f-replacement_id" class="w-full px-4 py-2 border rounded-lg bg-white"><option value="">Loading supervisors...</option></select></div>' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-1">Response to Supervisor (optional)</label><textarea id="f-admin_response" rows="2" class="w-full px-4 py-2 border rounded-lg"></textarea></div>' +
    '</div>',
    async function() {
      const replacementId = document.getElementById('f-replacement_id').value;
      const response = document.getElementById('f-admin_response').value.trim();
      if (!replacementId) throw new Error('Please select a replacement supervisor');
      
      await api.patch('/cancellation-proposals/' + proposalId + '/approve', {
        replacement_supervisor_id: replacementId,
        admin_response: response,
      });
      showToast('Request approved and replacement assigned');
    }
  );
  
  // Load supervisors
  const select = document.getElementById('f-replacement_id');
  api.get('/supervisors').then(function(res) {
    const supervisors = res.data.supervisors || [];
    select.innerHTML = '<option value="">-- Select Replacement --</option>' +
      supervisors.map(function(s) { return '<option value="' + s._id + '">' + s.full_name + ' (' + s.email + ')</option>'; }).join('');
  }).catch(function() {
    select.innerHTML = '<option value="">Failed to load</option>';
  });
}

function openDeclineProposalModal(proposalId) {
  openModal('Decline Cancellation Request',
    '<div class="space-y-4">' +
      '<p class="text-sm text-gray-600">The supervisor will be notified that their request has been declined.</p>' +
      '<div><label class="block text-sm font-medium text-gray-700 mb-1">Reason for declining (optional)</label><textarea id="f-admin_response" rows="3" placeholder="Explain why the request is declined..." class="w-full px-4 py-2 border rounded-lg"></textarea></div>' +
    '</div>',
    async function() {
      const response = document.getElementById('f-admin_response').value.trim();
      await api.patch('/cancellation-proposals/' + proposalId + '/decline', {
        admin_response: response,
      });
      showToast('Request declined');
    }
  );
}

    renderView();
  </script>
</body>
</html>
