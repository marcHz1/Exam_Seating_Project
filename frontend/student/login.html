<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - Exam Seating System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            university: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4',
              400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e',
              800: '#115e59', 900: '#134e4a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-gray-50 via-blue-50/30 to-gray-100 min-h-screen flex items-center justify-center">
  <!-- University Header Strip -->
  <div class="fixed top-0 left-0 right-0 university-header text-white py-2 px-4 text-center text-xs font-medium z-50">
    <span class="ar-text">جامعة حلب - كلية الهندسة المعلوماتية</span>
    <span class="mx-2">|</span>
    <span>University of Aleppo - Informatics Engineering Faculty</span>
  </div>

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 mt-8">
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <div class="relative">
          <img src="../image/logo.png" alt="University Logo" class="w-16 h-16 object-contain">
          <div class="absolute -bottom-1 -right-1 w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center border-2 border-white">
            <i class="fas fa-user-graduate text-white text-xs"></i>
          </div>
        </div>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Student Login</h1>
      <p class="text-gray-500 mt-1 text-sm flex items-center justify-center">
        <i class="fas fa-book-reader mr-2 text-blue-500"></i>Access your exam schedule and seat assignments
      </p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
          <i class="fas fa-envelope mr-2 text-blue-500 w-4"></i>Email
        </label>
        <div class="relative">
          <input type="email" id="email" required 
            class="w-full px-4 py-2.5 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50/50"
            placeholder="student@alepuniv.edu.sy">
          <i class="fas fa-at absolute left-3.5 top-3 text-gray-400 text-sm"></i>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1 flex items-center">
          <i class="fas fa-lock mr-2 text-blue-500 w-4"></i>Password
        </label>
        <div class="relative">
          <input type="password" id="password" required 
            class="w-full px-4 py-2.5 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50/50"
            placeholder="Enter your password">
          <i class="fas fa-key absolute left-3.5 top-3 text-gray-400 text-sm"></i>
        </div>
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white py-2.5 rounded-lg font-medium hover:from-blue-700 hover:to-blue-600 hover:shadow-lg transition-all flex items-center justify-center space-x-2">
        <i class="fas fa-sign-in-alt"></i>
        <span>Sign In</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-gray-100">
      <p class="text-center text-sm text-gray-500 flex items-center justify-center">
        <i class="fas fa-arrow-left mr-2 text-blue-500"></i>
        <a href="/" class="text-blue-600 hover:text-blue-800 font-medium hover:underline">Back to home</a>
      </p>
    </div>

    <!-- Footer info -->
    <div class="mt-6 text-center">
      <p class="text-xs text-gray-400 flex items-center justify-center">
        <i class="fas fa-shield-alt mr-1 text-blue-400"></i>
        Official Academic System - University of Aleppo
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const api = new ApiClient('student');
      try {
        const data = await api.post('/auth/student/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        localStorage.setItem('student_token', data.data.token);
        localStorage.setItem('student_user', JSON.stringify(data.data.user));
        window.location.href = '/student/dashboard.html';
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
